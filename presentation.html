<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantalla TV - Cronómetro</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="presentation-body">
  <!-- Fondo dinámico con partículas de luz y gradientes profundos -->
  <div class="background tv-background">
    <div class="shape shape-tv-1"></div>
    <div class="shape shape-tv-2"></div>
    <div class="shape shape-tv-3"></div>
  </div>

  <main class="tv-viewport">
    <!-- Contenedor central del Cronómetro gigante -->
    <div class="tv-timer-container">
      <div id="tv-timer" class="tv-timer-display">00:00</div>
      
      <!-- Indicador de estado adicional cuando finaliza o excede -->
      <div id="tv-status-badge" class="tv-status-badge hidden">
        <span id="tv-status-text">TIEMPO CUMPLIDO</span>
      </div>
    </div>

    <!-- Placa elegante de Discursante y Tema (si el controlador la activa) -->
    <div id="tv-speaker-overlay" class="tv-speaker-overlay hidden">
      <div class="glass-panel tv-speaker-card">
        <span class="tv-speaker-tag">PARTICIPACIÓN ACTUAL</span>
        <h1 id="tv-speaker-name"></h1>
        <h2 id="tv-speaker-origin"></h2>
        <div id="tv-divider" class="tv-divider"></div>
        <p id="tv-speaker-topic"></p>
        <div id="tv-speaker-song-wrap" class="tv-song-pill hidden">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          <span id="tv-speaker-song"></span>
        </div>
      </div>
    </div>

    <!-- Pantalla de Espera / Standby cuando no hay cronómetro corriendo -->
    <div id="tv-standby" class="tv-standby hidden">
      <div class="tv-standby-glow"></div>
      <div class="tv-standby-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </div>
      <h2>Pantalla Conectada</h2>
      <p>Esperando señal del panel de control...</p>
    </div>
  </main>

  <script src="js/presentation-view.js"></script>
</body>
</html>
